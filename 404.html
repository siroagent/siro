  <style>
    /* The S engraved in an aluminium faceplate, the ball at rest where the route starts. Drawn here,
       not rendered, because the S is always cut into metal, never floating.
       main.lost, not .lost: the shared stylesheet loads after this block, and its .wrap padding
       would otherwise win at equal specificity and drop the vertical padding. */
    main.lost {
      align-items: center;
      row-gap: 40px;
      padding-block: 72px 96px;
    }
    .lost__text {
      grid-column: 1 / span 6;
      display: grid;
      justify-items: start;
      gap: 24px;
    }
    /* A long path breaks anywhere; each piece keeps its own well instead of one well cut open. */
    .lost__text code {
      overflow-wrap: anywhere;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }
    .lost__keys {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .lost__more a {
      font-weight: 500;
    }
    /* A link on its own line, not inside a sentence, so it gets the 44px touch height of a key. */
    @media (pointer: coarse) {
      .lost__more a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
      }
    }
    .lost__art {
      grid-column: 8 / -1;
      justify-self: center;
      display: grid;
      place-items: center;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1;
      border-radius: 6px;
      background: var(--face);
      box-shadow: var(--l1);
    }
    .lost__s {
      position: relative;
      width: 42%;
      aspect-ratio: 741 / 980;
    }
    /* Engraved: a dark cut with a light lip under it, like the S in the rail. */
    .lost__s > svg {
      display: block;
      width: 100%;
      height: 100%;
      fill: #2a2e34;
      filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.9));
    }
    /* At rest at the entry, the first station of the route; a touch wider than the lane. */
    .lost__ball {
      position: absolute;
      left: 94.47%;
      top: 10.05%;
      width: 7.6%;
      min-width: 11px;
      transform: translate(-50%, -50%);
    }
    .lost__ball svg {
      display: block;
      width: 100%;
      height: auto;
    }
    @media (max-width: 899px) {
      main.lost {
        padding-block: 48px 64px;
      }
      .lost__text,
      .lost__art {
        grid-column: 1 / -1;
      }
      .lost__art {
        max-width: min(72vw, 400px);
      }
    }
  </style>
