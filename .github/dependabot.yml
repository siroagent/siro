version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # One pull request per week for minor and patch updates. Major versions change APIs the
  # payment code relies on (viem, @noble, @scure) and are upgraded by hand with tests.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /cli
    schedule:
      interval: weekly
    groups:
      cli:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
